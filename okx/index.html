<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>VIP专属 · 欧易注册</title>
<style>
:root{--tx:#1c1c1e;--t2:rgba(60,60,67,.64);--t3:rgba(60,60,67,.42);--ink:#26262b;--ink2:#2e2e34;--gold:#c6a45c;--gold-d:#a88e54;--gold-l:#e8cf8f;--up:#1b9a43;--dn:#d92a1f;--upb:#34c759;--dnb:#ff3b30;--ac:#007aff;color-scheme:light}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{color:var(--tx);font-family:-apple-system,"SF Pro Display","SF Pro Text","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;font-size:15px;line-height:1.68;letter-spacing:.012em;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;background:#eef2f9}
a{color:inherit;text-decoration:none}
.m{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
:focus-visible{outline:2.5px solid var(--ac);outline-offset:2px}
/* 背景：近白 + 淡蓝/蜜桃/薄荷/淡紫光晕（与币安版同一套） */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(165deg,#fcfdff 0%,#f1f5fc 48%,#e8eef8 100%)}
.bg i{position:absolute;border-radius:50%;filter:blur(80px)}
.bg .o1{width:52vmax;height:52vmax;left:-18vmax;top:-18vmax;background:rgba(140,185,255,.5)}
.bg .o2{width:38vmax;height:38vmax;right:-12vmax;top:8vmax;background:rgba(255,196,165,.55)}
.bg .o3{width:40vmax;height:40vmax;left:22vw;bottom:-22vmax;background:rgba(168,240,212,.5)}
.bg .o4{width:30vmax;height:30vmax;right:18vw;top:52vh;background:rgba(205,190,255,.42)}
.bg .glow{position:absolute;right:-20vmax;top:-24vmax;width:80vmax;height:80vmax;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,1),rgba(255,251,240,.65) 36%,transparent 70%);filter:blur(24px)}
/* 玻璃基础 */
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.68),rgba(255,255,255,.34));-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),0 0 0 1px rgba(90,110,150,.08),0 24px 60px -20px rgba(60,80,130,.28),0 4px 16px rgba(60,80,130,.07)}
.glass:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;background:linear-gradient(135deg,#fff,rgba(255,255,255,.1) 34%,rgba(255,255,255,.06) 66%,rgba(255,255,255,.85));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass>*{position:relative;z-index:1}
/* 顶栏 */
header{position:sticky;top:max(10px,env(safe-area-inset-top,0px));z-index:30;max-width:1120px;margin:10px auto 0;padding:0 16px}
.bar{border-radius:999px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:6px;min-height:56px}
.back-link{flex:none;font-size:13px;font-weight:600;color:var(--t2);padding:7px 10px;border-radius:999px;white-space:nowrap;margin-right:2px}
.back-link:hover{background:rgba(255,255,255,.85);color:var(--tx)}
@media(max-width:640px){.back-link{font-size:12px;padding:6px 5px;margin-right:0}}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-right:14px;white-space:nowrap;letter-spacing:-.02em}
.brand img{height:26px;width:auto;border-radius:6px;display:block;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.28)}
nav.d{display:flex;align-items:center;gap:2px;flex:1}
nav.d a,nav.d button{background:none;border:0;color:var(--t2);font:inherit;font-size:14px;font-weight:650;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:36px}
nav.d a:hover,nav.d button:hover{background:rgba(255,255,255,.85);color:var(--tx)}
nav.d a.on{color:var(--tx);background:#fff;box-shadow:0 2px 10px rgba(60,80,130,.14)}
.more{position:relative}
.menu{position:absolute;top:calc(100% + 10px);left:0;min-width:190px;border-radius:22px;padding:8px;display:none}
.more.open .menu{display:block}
.menu a{display:block;padding:10px 12px;border-radius:14px;font-size:14px;color:var(--tx)}.menu a:hover{background:rgba(255,255,255,.9)}
.burger{display:none;margin-left:auto;background:rgba(255,255,255,.8);border:0;color:var(--tx);border-radius:999px;width:40px;height:40px;font-size:18px;cursor:pointer;box-shadow:0 2px 10px rgba(60,80,130,.14)}
@media(max-width:860px){nav.d{display:none}.burger{display:block}}
.drawer{position:fixed;inset:0;z-index:40;background:rgba(30,40,70,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none}
.drawer.open{display:block}
.drawer>div{position:absolute;right:10px;top:10px;bottom:10px;width:min(320px,86%);border-radius:30px;padding:22px;overflow:auto}
.drawer h3{font-size:12px;color:var(--t2);letter-spacing:.08em;margin:8px 0}
.drawer small{color:var(--t2);display:block;margin-bottom:12px}
.drawer a{display:block;padding:12px;border-radius:14px;font-weight:650}.drawer a:hover{background:rgba(255,255,255,.9)}
/* 主体 */
main{max-width:1120px;margin:0 auto;padding:26px 16px 28px}
.eb{font-size:12.5px;color:#3a3a3c;letter-spacing:.14em;font-weight:700}
h1{font-size:clamp(36px,5vw,54px);letter-spacing:-.02em;margin:6px 0 20px;line-height:1.12;font-weight:700}
.lab{font-size:13px;color:var(--t2);font-weight:700;margin:22px 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 26px;font:inherit;font-weight:700;font-size:15px;color:#f5f2ea;background:linear-gradient(180deg,rgba(62,62,70,.92),rgba(26,26,31,.94));-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);cursor:pointer;box-shadow:0 12px 26px -8px rgba(30,27,18,.42),0 0 0 1px rgba(198,164,92,.38),0 0 16px rgba(198,164,92,.10),inset 0 1.5px 0 rgba(255,255,255,.30),inset 0 0 0 1px rgba(255,255,255,.05);transition:transform .15s,filter .15s;min-height:44px}
.btn:hover{filter:brightness(1.16);transform:translateY(-1px)}.btn:active{transform:scale(.98)}
.btn.g{background:rgba(255,255,255,.78);color:var(--tx);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(168,142,84,.30),0 4px 14px rgba(60,80,130,.1)}
.btn.g:hover{background:#fff;filter:none}
.btn.s{padding:9px 18px;font-size:13.5px;min-height:38px}
/* 邀请条 */
.invite{background:rgba(255,255,255,.62);border-radius:20px;padding:19px 22px;display:flex;align-items:center;gap:22px;flex-wrap:nowrap;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(90,110,150,.08)}
.invite-left{display:flex;flex-direction:column;align-items:flex-start;gap:10px;flex:none;min-width:0}
.invite-left>.btn{flex-shrink:0}
.invite-div{flex:none;align-self:stretch;width:1px;background:linear-gradient(180deg,transparent,rgba(90,110,150,.22) 22%,rgba(90,110,150,.22) 78%,transparent)}
.invite-lines{color:var(--t2);font-size:14px;text-align:left;line-height:1.5;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:7px}
.invite-head{font-size:17px;font-weight:700;color:var(--tx);letter-spacing:0}
.invite-head b{font-family:Georgia,"Times New Roman","Songti SC","STSong","SimSun",serif;font-size:1.18em;font-weight:700;letter-spacing:.03em;margin:0 .3em;line-height:1.3;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;background:linear-gradient(115deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,.06) 34%,rgba(255,255,255,0) 52%),linear-gradient(180deg,rgba(23,20,16,.92) 0%,rgba(38,33,26,.92) 52%,rgba(109,85,16,.92) 84%,rgba(193,146,10,.92) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.perk{display:flex;align-items:center;gap:9px;min-width:0}
.perk-dot{flex:none;width:19px;height:19px;border-radius:50%;background:linear-gradient(180deg,rgba(62,62,70,.94),rgba(28,28,33,.96));color:#f5f2ea;font-size:11.5px;font-weight:900;line-height:1;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 0 0 1px rgba(198,164,92,.45),0 2px 6px rgba(30,27,18,.28)}
.perk .hl{font-family:Georgia,"Times New Roman","Songti SC","STSong","SimSun",serif;font-size:1.3em;font-weight:700;letter-spacing:.03em;line-height:1.3;white-space:nowrap;vertical-align:baseline;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;background:linear-gradient(180deg,#171410 0%,#26211a 52%,#6d5510 84%,#c1920a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.perk-laurel{width:11px;height:22px;display:inline-block;vertical-align:-5px;margin:0 2px;flex:none}
.perk-laurel.flip{transform:scaleX(-1)}
@media(max-width:560px){
  .invite{padding:16px;gap:12px;flex-direction:column;align-items:stretch}
  .invite-left{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
  .invite-div{width:auto;height:1px;align-self:auto;background:linear-gradient(90deg,transparent,rgba(90,110,150,.22) 22%,rgba(90,110,150,.22) 78%,transparent)}
  .invite-lines{font-size:13px;line-height:1.55;gap:8px;width:100%}
  .invite-head{font-size:15.5px}
  .invite-head b{font-size:1.18em}
  .perk{align-items:flex-start;gap:8px;line-height:1.55}
  .perk-dot{flex:0 0 18px;width:18px;height:18px;font-size:10.5px;margin-top:1px}
  .perk>span:last-child{flex:1 1 auto;min-width:0;line-height:1.55}
  .perk .hl{font-size:1.18em;line-height:inherit;vertical-align:baseline;letter-spacing:0}
  .invite-left>.btn{padding:9px 15px}
  .invite+.lab{margin-top:30px}
}
/* 热门币种（注册区下方通栏横排） */
.hot{margin-top:20px;border-radius:34px;padding:26px 28px}
@media(max-width:560px){.hot{padding:20px}}
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.hd h2{font-size:20px;display:flex;align-items:center;gap:10px;letter-spacing:-.02em;flex-wrap:wrap}
.live{font-size:12px;color:var(--t2);display:inline-flex;align-items:center;gap:6px;font-weight:650;background:rgba(255,255,255,.7);padding:5px 11px;border-radius:999px;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(90,110,150,.08)}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:#8e8e93;flex:none}

.live.delayed:before{background:#ff9500;box-shadow:0 0 6px rgba(255,149,0,.55)}
.coin .p{transition:background-color .45s ease}

.coin .p.fd{background:rgba(255,59,48,.16)}
.hd>a{color:#0062cc;font-size:14px;font-weight:650;padding-top:4px;min-height:32px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.coin .meta{font-size:10.5px}.meta-pre{display:none}}
.coin{border-radius:20px;padding:14px 16px;transition:transform .2s,box-shadow .2s;min-width:0;display:flex;flex-direction:column}
.coin:hover{transform:translateY(-2px)}
.coin .t{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;gap:8px;white-space:nowrap}
.coin .t b{font-size:15px}
.coin .t span{font-size:12px;font-weight:700;margin-left:auto}
.coin .p{font-size:16px;font-weight:700;margin:6px 0 4px;letter-spacing:-.02em;border-radius:8px;padding:0 4px;margin-left:-4px;white-space:nowrap}
.coin .meta{font-size:11px;color:var(--t3);font-weight:600;white-space:nowrap;overflow:hidden;margin-bottom:8px}
.coin svg{width:100%;height:30px;display:block;margin-top:auto}
/* 信任 + 储备金证明 */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
@media(max-width:760px){.badges{grid-template-columns:1fr}}
.badge{border-radius:28px;padding:20px;display:flex;gap:14px;align-items:center;font-size:14px;color:var(--t2);line-height:1.6}
.safu{margin-top:20px;border-radius:34px;padding:32px}
.safu h2{font-size:25px;margin-bottom:8px;letter-spacing:-.02em}
.safu p{color:var(--t2);max-width:640px}
.safu .st{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
@media(max-width:700px){.safu .st{grid-template-columns:1fr}}
.safu .st div{background:rgba(255,255,255,.6);border-radius:18px;padding:16px;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(90,110,150,.07)}
.safu .st b{display:block;font-size:24px;color:#1c1c1e}.safu .st span{font-size:12.5px;color:var(--t2)}
.safu .src{margin-top:16px;font-size:12.5px;word-break:break-all}
.safu .src a{color:#0062cc;font-weight:650}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid #fff;box-shadow:0 16px 40px rgba(40,70,130,.22);color:var(--tx);padding:12px 22px;border-radius:999px;font-size:14px;font-weight:650;transition:all .3s;z-index:60;max-width:calc(100% - 40px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* 白玻璃贵气面板：强模糊 + 香槟金微光 + 极淡细线 + 金色细边（欧易黑白主色，细节处点金） */
.royal{border-radius:34px;padding:38px 36px;color:var(--tx);background:radial-gradient(120% 90% at 85% 0%,rgba(198,164,92,.12),transparent 55%),radial-gradient(90% 70% at 8% 100%,rgba(70,64,48,.05),transparent 60%),repeating-linear-gradient(180deg,rgba(60,56,44,.03) 0,rgba(60,56,44,.03) 1px,transparent 1px,transparent 24px),linear-gradient(160deg,rgba(255,255,255,.84),rgba(255,255,255,.54));-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(168,142,84,.48);box-shadow:0 24px 60px -20px rgba(60,80,130,.26),0 4px 16px rgba(60,80,130,.07),0 0 46px rgba(198,164,92,.12),inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(198,164,92,.16)}

.royal .eb{color:#3a3a3c;letter-spacing:.34em}
.royal h1{color:#1c1c1e}
/* 排名徽章：标题正上方，深墨玻璃底 + 香槟金细边与光晕，跟随标题左对齐 */
.rank-badge{display:inline-flex;align-items:center;gap:7px;margin-top:14px;background:linear-gradient(180deg,rgba(56,56,64,.92),rgba(24,24,29,.94));-webkit-backdrop-filter:blur(12px) saturate(150%);backdrop-filter:blur(12px) saturate(150%);color:#f5f2ea;border:1px solid rgba(198,164,92,.6);border-radius:999px;padding:7px 16px;font-size:15px;font-weight:700;letter-spacing:.12em;line-height:1.3;box-shadow:0 10px 22px -8px rgba(30,27,18,.4),0 0 18px rgba(198,164,92,.22),inset 0 1.5px 0 rgba(255,255,255,.3);white-space:nowrap;max-width:100%}
.rank-badge:before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:linear-gradient(180deg,var(--gold-l),var(--gold));box-shadow:0 0 0 3px rgba(198,164,92,.25),0 0 8px rgba(198,164,92,.6)}
html[lang="en"] .rank-badge{font-size:13.5px;letter-spacing:.06em}
@media(max-width:560px){.rank-badge{font-size:13.5px;padding:6px 14px;letter-spacing:.06em}html[lang="en"] .rank-badge{font-size:12px;white-space:normal;text-align:left}}
.ink-text{background:linear-gradient(168deg,#43434a 0%,#232327 46%,#57492c 72%,#1b1b1f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
/* 数据行：大号数字 + 同行说明（基线对齐），右侧两个月桂徽章 */
.rstats{display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap;margin-bottom:24px}
.rbig{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}

.rbig span{color:#2b2b2b;font-weight:700;font-size:clamp(17px,2.2vw,23px);line-height:1.3;letter-spacing:.03em;white-space:nowrap}
.rno1s{display:flex;gap:clamp(18px,4vw,48px);flex-wrap:wrap}
.rno1{display:flex;align-items:center;gap:4px}
.rno1-mid{text-align:center}
.rno1-mid b{display:block;font-size:clamp(30px,4vw,44px);font-weight:800;line-height:1.05}
.rno1-mid span{display:block;color:#3a3a3c;font-size:13px;font-weight:650;letter-spacing:.2em;margin-top:5px}
.laurel{flex:none}
/* 邀请条（贵气面板内）：白玻璃 + 香槟金细边与淡金光晕 */
.royal .invite{background:rgba(255,255,255,.55);border:1px solid rgba(168,142,84,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 26px rgba(198,164,92,.14),0 4px 14px rgba(60,80,130,.06)}

.royal .invite-div{background:linear-gradient(180deg,transparent,rgba(178,150,90,.55) 22%,rgba(178,150,90,.55) 78%,transparent)}
.royal .lab{color:#3a3a3c}
.royal .btn.g{background:rgba(255,255,255,.75);color:var(--tx);box-shadow:inset 0 0 0 1px rgba(168,142,84,.5),inset 0 1px 0 rgba(255,255,255,.9),0 4px 14px rgba(60,80,130,.08)}
.royal .btn.g:hover{background:#fff}
.royal .invite .btn{background:linear-gradient(180deg,rgba(62,62,70,.92),rgba(26,26,31,.94));color:#f5f2ea;box-shadow:0 12px 26px -8px rgba(30,27,18,.42),0 0 0 1px rgba(198,164,92,.38),inset 0 1.5px 0 rgba(255,255,255,.3)}
.royal .invite .btn:hover{background:linear-gradient(180deg,rgba(62,62,70,.92),rgba(26,26,31,.94));filter:brightness(1.16)}

  .rstats{flex-direction:column;align-items:flex-start;gap:22px}

/* 官方链接区布局：左侧链接/下载，右侧独立换补绑卡片 */
.links-wrap{display:flex;gap:22px;align-items:stretch}
.links-main{flex:1 1 auto;min-width:0}
.links-main .lab:first-child{margin-top:22px}
/* 换补绑卡片：香槟金细边 + 淡金光晕 + 玻璃通透，独立成块 */
.rebind{flex:0 0 302px;max-width:340px;margin-top:22px;border:1.5px solid rgba(168,142,84,.72);border-radius:24px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(160deg,rgba(252,250,244,.92),rgba(255,255,255,.78) 62%,rgba(243,238,226,.88));-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);box-shadow:0 0 0 1px rgba(198,164,92,.16),0 0 34px rgba(198,164,92,.20),0 20px 40px -14px rgba(52,45,26,.28),inset 0 1px 0 rgba(255,255,255,.95)}

/* ---------- 热门币种：实时行情（OKX 官方公开接口每 5 秒拉一次；不通时顺延 CoinGecko 备用源；走势线用 OKX K 线每 60 秒刷新） ---------- */
const SYMS=[
 {s:"BTC",inst:"BTC-USDT",cg:"bitcoin"},
 {s:"ETH",inst:"ETH-USDT",cg:"ethereum"},
 {s:"OKB",inst:"OKB-USDT",cg:"okb"},
 {s:"SOL",inst:"SOL-USDT",cg:"solana"},

];
const liveData={},sparkData={};
let lastOkAt=0,srcName="OKX";
const dp=v=>v>=1000?2:v>=10?2:v>=1?3:v>=.01?5:7,f=v=>"$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:dp(v),maximumFractionDigits:dp(v)}),pc=v=>(v>=0?"+":"")+v.toFixed(2)+"%";
function priceFontSize(text){const len=text.length;if(len<=9)return 16;if(len<=11)return 14.5;if(len<=13)return 13;return 11.5}
function sparkPath(a,up){if(!a||a.length<2)return"";const mn=Math.min.apply(null,a),mx=Math.max.apply(null,a),r=mx-mn||1,d=a.map((v,i)=>(i?"L":"M")+(i/(a.length-1)*100).toFixed(1)+" "+(3+(1-(v-mn)/r)*24).toFixed(1)).join("");return`<path d="${d}" fill="none" stroke="${up?"#34c759":"#ff3b30"}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`}
function buildCards(){$("grid").innerHTML=SYMS.map(c=>`<div class="coin glass"><div class="t"><b>${c.s}</b><span class="m" id="pct-${c.s}">—</span></div><div class="p m" id="price-${c.s}">${T().fetching}</div><div class="meta" id="meta-${c.s}"></div><svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true" id="spark-${c.s}"></svg></div>`).join("");paintPrices(false);paintSparks();updateStatus()}
function paintPrices(flash){SYMS.forEach(c=>{const d=liveData[c.s],pe=$("price-"+c.s),ce=$("pct-"+c.s);if(!pe||!ce)return;
  if(!d){pe.textContent=T().fetching;ce.textContent="—";ce.className="m";return}
  const txt=f(d.p);
  if(flash&&pe.dataset.v!=null&&pe.dataset.v!==""&&parseFloat(pe.dataset.v)!==d.p){pe.classList.remove("fu","fd");void pe.offsetWidth;pe.classList.add(d.p>parseFloat(pe.dataset.v)?"fu":"fd");setTimeout(()=>pe.classList.remove("fu","fd"),650)}
  pe.dataset.v=d.p;pe.textContent=txt;pe.style.fontSize=priceFontSize(txt)+"px";
  const up=d.pct>=0;ce.textContent=pc(d.pct);ce.className="m "+(up?"up":"dn")})}
function paintSparks(){SYMS.forEach(c=>{const el=$("spark-"+c.s);if(!el)return;const a=sparkData[c.s];if(!a||a.length<2){el.innerHTML="";return}const d=liveData[c.s];el.innerHTML=sparkPath(a,d?d.pct>=0:true)})}
function relTail(){if(!lastOkAt)return T().fetching;const sec=Math.floor((Date.now()-lastOkAt)/1000);if(sec>30)return T().delayed;return sec<=1?T().justNow:sec+T().secAgo}
function updateStatus(){const t=T(),el=$("live");if(el){const delayed=!!lastOkAt&&(Date.now()-lastOkAt>30000);
  el.textContent=!lastOkAt?t.liveLoading:t.livePre+srcName+" · "+relTail();
  el.classList.toggle("ok",!!lastOkAt&&!delayed);el.classList.toggle("delayed",delayed)}
  SYMS.forEach(c=>{const m=$("meta-"+c.s);if(m)m.textContent=t.sourcePre+srcName+" · "+relTail()})}
function getJSON(u){const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),9000);
  return fetch(u,{cache:"no-store",signal:ctl.signal}).then(r=>{clearTimeout(to);if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).catch(e=>{clearTimeout(to);throw e})}
async function pullOKX(){const j=await getJSON("https://www.okx.com/api/v5/market/tickers?instType=SPOT");const map={};(j.data||[]).forEach(d=>map[d.instId]=d);let n=0;
  SYMS.forEach(c=>{const d=map[c.inst];if(d&&d.last){const last=parseFloat(d.last),op=parseFloat(d.open24h);liveData[c.s]={p:last,pct:op?(last-op)/op*100:0};n++}});
  if(!n)throw new Error("empty");srcName="OKX"}
async function pullCG(){const j=await getJSON("https://api.coingecko.com/api/v3/simple/price?ids="+SYMS.map(c=>c.cg).join(",")+"&vs_currencies=usd&include_24hr_change=true");let n=0;
  SYMS.forEach(c=>{const d=j[c.cg];if(d&&d.usd){liveData[c.s]={p:d.usd,pct:d.usd_24h_change||0};n++}});
  if(!n)throw new Error("empty");srcName="CoinGecko"}
async function pullPrices(){try{await pullOKX()}catch(e){try{await pullCG()}catch(e2){updateStatus();return}}
  lastOkAt=Date.now();paintPrices(true);paintSparks();updateStatus()}
async function pullCandles(){await Promise.all(SYMS.map(async c=>{try{const j=await getJSON("https://www.okx.com/api/v5/market/candles?instId="+c.inst+"&bar=15m&limit=96");
  const closes=(j.data||[]).slice().reverse().map(r=>parseFloat(r[4])).filter(v=>v>0);if(closes.length>1)sparkData[c.s]=closes}catch(e){}}));paintSparks()}
