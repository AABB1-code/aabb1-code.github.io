<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!-- Empty inline icon: stops the browser fetching /favicon.ico, which
         lives outside the artifact's routes and 404s. -->
    <link rel="icon" href="data:," />
    <title>VIP专属 · 交易所选择</title>
    <style>
      :root {
        --ink: #1c1e24;
        --ink-soft: #4a4e57;
        --ink-faint: #8a8f98;
        --gold: #c9962e;
        --gold-deep: #9a6b14;
        --gold-bright: #f0b90b;
        --hairline: rgba(160, 128, 52, 0.22);
        --glass: rgba(255, 255, 255, 0.62);
        --glass-edge: rgba(255, 255, 255, 0.85);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1100px 620px at 12% -10%, rgba(240, 185, 11, 0.10), rgba(240, 185, 11, 0) 60%),
          radial-gradient(1000px 640px at 92% 108%, rgba(70, 84, 110, 0.10), rgba(70, 84, 110, 0) 62%),
          linear-gradient(168deg, #fdfdfe 0%, #f4f5f7 52%, #eef0f3 100%);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 20px 56px;
        animation: rise 0.7s cubic-bezier(0.22, 0.9, 0.3, 1) both;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        main { animation: none; }
        .choice, .disc, .enter .arrow { transition: none !important; }
      }

      /* ---------- Heading ---------- */
      header { text-align: center; margin-bottom: 46px; }
      h1 {
        margin: 0;
        font-size: clamp(40px, 8vw, 58px);
        font-weight: 800;
        letter-spacing: 0.14em;
        text-indent: 0.14em;
        line-height: 1.15;
        color: var(--ink);
      }
      .subtitle {
        margin: 14px 0 0;
        font-size: 15px;
        letter-spacing: 0.06em;
        color: var(--ink-faint);
      }
      .subtitle .code {
        font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        font-weight: 700;
        font-size: 1.12em;
        letter-spacing: 0.08em;
        background: linear-gradient(100deg, #23242a 20%, #6d5212 52%, #b8860b 78%, #2a2416 105%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      /* ---------- Choices ---------- */
      .choices {
        display: flex;
        gap: clamp(20px, 5vw, 56px);
        align-items: stretch;
        justify-content: center;
        flex-wrap: wrap;
        width: 100%;
        max-width: 760px;
      }
      .choice {
        flex: 1 1 280px;
        max-width: 340px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        text-decoration: none;
        color: inherit;
        padding: 38px 26px 32px;
        border-radius: 32px;
        background: var(--glass);
        border: 1px solid var(--hairline);
        box-shadow:
          inset 0 1px 0 var(--glass-edge),
          0 18px 44px rgba(31, 35, 44, 0.08),
          0 3px 10px rgba(31, 35, 44, 0.05);
        backdrop-filter: blur(18px) saturate(1.5);
        -webkit-backdrop-filter: blur(18px) saturate(1.5);
        transition: transform 0.28s cubic-bezier(0.22, 0.9, 0.3, 1), box-shadow 0.28s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .choice:hover {
        transform: translateY(-5px);
        box-shadow:
          inset 0 1px 0 var(--glass-edge),
          0 28px 56px rgba(31, 35, 44, 0.13),
          0 6px 16px rgba(31, 35, 44, 0.07);
      }
      .choice:active { transform: translateY(-1px) scale(0.975); }
      .choice:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 4px;
      }

      /* ---------- The big discs ---------- */
      .disc {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        flex: none;
        transition: transform 0.28s cubic-bezier(0.22, 0.9, 0.3, 1);
      }
      .choice:hover .disc { transform: scale(1.035); }
      .choice:active .disc { transform: scale(0.97); }
      .disc::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: linear-gradient(155deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.12) 34%, rgba(255, 255, 255, 0) 55%);
        pointer-events: none;
      }
      .disc--binance {
        background: radial-gradient(circle at 32% 26%, #ffe89a 0%, #f7cd45 34%, var(--gold-bright) 62%, #d99e06 100%);
        box-shadow:
          inset 0 2px 3px rgba(255, 255, 255, 0.75),
          inset 0 -10px 22px rgba(146, 96, 0, 0.35),
          0 16px 34px rgba(198, 142, 10, 0.38);
      }
      .disc--okx {
        background: radial-gradient(circle at 32% 26%, #3d4149 0%, #1d1f24 46%, #0c0d10 100%);
        box-shadow:
          inset 0 2px 3px rgba(255, 255, 255, 0.35),
          inset 0 -10px 22px rgba(0, 0, 0, 0.55),
          0 16px 34px rgba(12, 13, 16, 0.34);
      }
      .disc svg { display: block; position: relative; z-index: 1; }

      /* ---------- Labels under each disc ---------- */
      .name {
        margin: 26px 0 0;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-indent: 0.22em;
        line-height: 1.2;
      }
      .en {
        margin: 7px 0 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: var(--ink-faint);
      }
      .rank {
        margin: 15px 0 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: var(--ink-soft);
        white-space: nowrap;
      }
      .rank .no { font-weight: 800; }
      .choice--binance .rank .no { color: var(--gold-deep); }
      .choice--okx .rank .no { color: var(--ink); }

      .enter {
        margin-top: 22px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 20px;
        border-radius: 999px;
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: 0.14em;
        border: 1px solid var(--hairline);
        background: rgba(255, 255, 255, 0.55);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      .choice--binance .enter { color: var(--gold-deep); }
      .choice--okx .enter { color: var(--ink); }
      .enter .arrow { transition: transform 0.25s ease; }
      .choice:hover .enter .arrow { transform: translateX(4px); }

      /* ---------- Mobile: stack ---------- */
      @media (max-width: 639px) {
        main { padding: 40px 18px 48px; justify-content: flex-start; }
        header { margin-bottom: 34px; }
        .choices { flex-direction: column; align-items: center; gap: 22px; }
        .choice { width: 100%; max-width: 400px; padding: 32px 22px 28px; }
        .disc { width: 168px; height: 168px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>VIP专属</h1>
        <p class="subtitle">邀请码 <span class="code">AABB1</span> · 币安、欧易通用</p>
      </header>

      <nav class="choices" aria-label="选择交易所">
        <a class="choice choice--binance" href="https://aabb1-code.github.io/binance/" aria-label="进入币安 Binance 注册页">
          <span class="disc disc--binance" aria-hidden="true">
            <svg width="118" height="118" viewBox="0 0 118 118" role="img" aria-label="币安金色 B 币图标">
              <defs>
                <radialGradient id="coinFace" cx="35%" cy="28%" r="85%">
                  <stop offset="0%" stop-color="#fff3c4" />
                  <stop offset="45%" stop-color="#ffd94d" />
                  <stop offset="100%" stop-color="#eda90c" />
                </radialGradient>
              </defs>
              <circle cx="59" cy="59" r="55" fill="url(#coinFace)" />
              <circle cx="59" cy="59" r="55" fill="none" stroke="#b97e04" stroke-width="2.5" />
              <circle cx="59" cy="59" r="46.5" fill="none" stroke="#c98f06" stroke-width="1.6" opacity="0.75" />
              <text x="59" y="80" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'PingFang SC', sans-serif"
                font-size="58" font-weight="800" fill="#8a5c00">B</text>
            </svg>
          </span>
          <span class="name">币安</span>
          <span class="en">BINANCE</span>
          <span class="rank"><span class="no">第1大所</span> · 全球最大交易所</span>
          <span class="enter">进入 <span class="arrow">→</span></span>
        </a>

        <a class="choice choice--okx" href="https://aabb1-code.github.io/okx/" aria-label="进入欧易 OKX 注册页">
          <span class="disc disc--okx" aria-hidden="true">
            <svg width="86" height="86" viewBox="0 0 86 86" role="img" aria-label="OKX 标志">
              <g fill="#ffffff">
                <rect x="2" y="2" width="24" height="24" rx="5" />
                <rect x="60" y="2" width="24" height="24" rx="5" />
                <rect x="31" y="31" width="24" height="24" rx="5" />
                <rect x="2" y="60" width="24" height="24" rx="5" />
                <rect x="60" y="60" width="24" height="24" rx="5" />
              </g>
            </svg>
          </span>
          <span class="name">欧易</span>
          <span class="en">OKX</span>
          <span class="rank"><span class="no">第2大所</span> · 全球第二大交易所</span>
          <span class="enter">进入 <span class="arrow">→</span></span>
        </a>
      </nav>
    </main>
  </body>
</html>
