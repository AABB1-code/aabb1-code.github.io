<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!-- Empty inline icon: stops the browser fetching /favicon.ico, which
         lives outside the artifact's routes and 404s. -->
    <link rel="icon" href="data:," />
    <title>VIP专属 · 交易所选择</title>
    <style>
      :root {
        --ink: #1c1e24;
        --ink-soft: #4a4e57;
        --ink-faint: #8a8f98;
        --gold: #c9962e;
        --gold-deep: #9a6b14;
        --gold-bright: #f0b90b;
        --hairline: rgba(160, 128, 52, 0.22);
        --glass: rgba(255, 255, 255, 0.62);
        --glass-edge: rgba(255, 255, 255, 0.85);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1100px 620px at 12% -10%, rgba(240, 185, 11, 0.10), rgba(240, 185, 11, 0) 60%),
          radial-gradient(1000px 640px at 92% 108%, rgba(70, 84, 110, 0.10), rgba(70, 84, 110, 0) 62%),
          linear-gradient(168deg, #fdfdfe 0%, #f4f5f7 52%, #eef0f3 100%);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 20px 56px;
        animation: rise 0.7s cubic-bezier(0.22, 0.9, 0.3, 1) both;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        main { animation: none; }
        .choice, .disc, .enter .arrow { transition: none !important; }
      }

      /* ---------- Language switch (same pill as the Binance / OKX pages) ---------- */
      .lang-row {
        width: 100%;
        max-width: 1140px;
        display: flex;
        justify-content: flex-end;
        margin-bottom: 26px;
      }
      .lang-switch {
        display: flex;
        align-items: center;
        gap: 2px;
        background: rgba(255, 255, 255, 0.55);
        border-radius: 999px;
        padding: 3px;
        box-shadow: inset 0 1px 0 #fff, 0 0 0 1px rgba(160, 128, 52, 0.18);
        backdrop-filter: blur(14px) saturate(1.4);
        -webkit-backdrop-filter: blur(14px) saturate(1.4);
        flex: none;
      }
      .lang-switch button {
        background: none;
        border: 0;
        font: inherit;
        font-size: 12.5px;
        font-weight: 650;
        color: var(--ink-faint);
        padding: 6px 12px;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        min-height: 36px;
        line-height: 1.2;
        -webkit-tap-highlight-color: transparent;
      }
      .lang-switch button:hover { color: var(--ink); }
      .lang-switch button.on {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 2px 8px rgba(60, 80, 130, 0.16);
      }
      .lang-switch button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      /* English strings are longer: ease the title tracking and let the
         rank lines wrap inside their cards instead of overflowing. */
      html[lang="en"] h1 { letter-spacing: 0.05em; text-indent: 0.05em; }
      html[lang="en"] .rank { white-space: normal; }

      /* ---------- Heading ---------- */
      header { text-align: center; margin-bottom: 46px; }
      h1 {
        margin: 0;
        font-size: clamp(40px, 8vw, 58px);
        font-weight: 800;
        letter-spacing: 0.14em;
        text-indent: 0.14em;
        line-height: 1.15;
        /* Glassy noble title: semi-transparent ink with a champagne-gold
           sheen running through it, a faint gold halo behind the glyphs. */
        background: linear-gradient(158deg,
          rgba(28, 30, 36, 0.94) 0%,
          rgba(28, 30, 36, 0.82) 38%,
          rgba(146, 110, 38, 0.88) 72%,
          rgba(28, 30, 36, 0.92) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        filter:
          drop-shadow(0 1px 0 rgba(255, 255, 255, 0.65))
          drop-shadow(0 0 16px rgba(201, 150, 46, 0.20));
      }
      .subtitle {
        margin: 14px 0 0;
        font-size: 15px;
        letter-spacing: 0.06em;
        color: var(--ink-faint);
      }
      .subtitle .code {
        font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        font-weight: 700;
        font-size: 1.12em;
        letter-spacing: 0.08em;
        background: linear-gradient(100deg, #23242a 20%, #6d5212 52%, #b8860b 78%, #2a2416 105%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      /* ---------- Choices ---------- */
      .choices {
        display: flex;
        gap: clamp(20px, 3.5vw, 44px);
        align-items: stretch;
        justify-content: center;
        flex-wrap: wrap;
        width: 100%;
        max-width: 1140px;
      }
      .choice {
        flex: 1 1 280px;
        max-width: 340px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        text-decoration: none;
        color: inherit;
        padding: 38px 26px 32px;
        border-radius: 32px;
        background: var(--glass);
        border: 1px solid var(--hairline);
        box-shadow:
          inset 0 1px 0 var(--glass-edge),
          0 18px 44px rgba(31, 35, 44, 0.08),
          0 3px 10px rgba(31, 35, 44, 0.05);
        backdrop-filter: blur(18px) saturate(1.5);
        -webkit-backdrop-filter: blur(18px) saturate(1.5);
        transition: transform 0.28s cubic-bezier(0.22, 0.9, 0.3, 1), box-shadow 0.28s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .choice:hover {
        transform: translateY(-5px);
        box-shadow:
          inset 0 1px 0 var(--glass-edge),
          0 28px 56px rgba(31, 35, 44, 0.13),
          0 6px 16px rgba(31, 35, 44, 0.07);
      }
      .choice:active { transform: translateY(-1px) scale(0.975); }
      .choice:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 4px;
      }

      /* ---------- The big discs ---------- */
      .disc {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        flex: none;
        transition: transform 0.28s cubic-bezier(0.22, 0.9, 0.3, 1);
        /* Frosted glass: the disc's colour is slightly translucent, and
           whatever sits behind it is blurred and saturated through it,
           so the disc reads as tinted glass rather than a solid coin. */
        backdrop-filter: blur(6px) saturate(1.35);
        -webkit-backdrop-filter: blur(6px) saturate(1.35);
      }
      .choice:hover .disc { transform: scale(1.035); }
      .choice:active .disc { transform: scale(0.97); }
      /* Liquid Glass shading: no surface reflection, no mirror sheen.
         The only overlay deepens the colour very slightly toward the
         rim, like light bending at the edge of thick glass. Painted
         under the logos (they carry z-index 1), so the marks stay
         crisp. */
      .disc::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 46%,
            rgba(255, 255, 255, 0) 52%,
            rgba(255, 255, 255, 0) 78%,
            rgba(10, 12, 18, 0.05) 92%,
            rgba(10, 12, 18, 0.10) 100%);
        pointer-events: none;
      }
      /* The glass edge: one fine, soft bright line running around the
         rim — brightest along the top arc, like light refracting out
         of the glass edge — a hairline of white just inside it, and a
         faint inner shadow pooled along the bottom so the disc keeps
         its floating depth. No broad highlight anywhere else. */
      .disc::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.85),
          inset 0 0 0 1px rgba(255, 255, 255, 0.42),
          inset 0 -18px 28px rgba(23, 25, 34, 0.13);
        pointer-events: none;
      }
      .disc--binance {
        /* Gold glass: a soft radial body — the middle a touch brighter,
           the colour deepening gently toward the rim — in slightly
           translucent gold so the frost behind it can breathe through. */
        background:
          radial-gradient(circle at 50% 40%,
            rgba(255, 233, 138, 0.96) 0%,
            rgba(246, 198, 52, 0.95) 42%,
            rgba(240, 185, 11, 0.95) 66%,
            rgba(214, 154, 6, 0.96) 88%,
            rgba(181, 126, 4, 0.97) 100%);
        box-shadow:
          inset 0 -18px 30px rgba(146, 96, 0, 0.26),
          inset 0 0 0 1px rgba(184, 134, 11, 0.38),
          0 0 26px rgba(240, 185, 11, 0.20),
          0 16px 34px rgba(146, 96, 0, 0.22),
          0 26px 30px -14px rgba(31, 35, 44, 0.18);
      }
      .disc--binance svg { filter: drop-shadow(0 2px 4px rgba(110, 72, 0, 0.62)) drop-shadow(0 0 1px rgba(122, 84, 0, 0.55)); }
      .disc--okx {
        /* Smoked glass: a soft radial body — the middle a touch lighter,
           easing down into near-black at the rim — in slightly
           translucent charcoal, so the disc reads as dark tinted glass
           rather than a solid black coin. */
        background:
          radial-gradient(circle at 50% 40%,
            rgba(66, 70, 80, 0.96) 0%,
            rgba(42, 44, 51, 0.96) 44%,
            rgba(24, 25, 30, 0.97) 74%,
            rgba(10, 11, 13, 0.98) 100%);
        box-shadow:
          inset 0 -16px 28px rgba(0, 0, 0, 0.50),
          inset 0 0 0 1px rgba(255, 255, 255, 0.12),
          0 0 24px rgba(120, 132, 155, 0.14),
          0 16px 34px rgba(12, 13, 16, 0.28),
          0 26px 30px -14px rgba(31, 35, 44, 0.20);
      }
      /* Bitget: the official logo tile (black double-chevron on brand cyan)
         fills the disc; a deep-sea-blue under-shadow keeps the cyan disc
         grounded on the light glass page. */
      .disc--bitget {
        background: #00e5ff;
        box-shadow:
          inset 0 -12px 24px rgba(0, 63, 92, 0.28),
          inset 0 0 0 1px rgba(0, 110, 140, 0.35),
          0 0 26px rgba(0, 197, 235, 0.22),
          0 16px 34px rgba(0, 63, 92, 0.24),
          0 26px 30px -14px rgba(31, 35, 44, 0.20);
      }
      .disc--bitget img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
      }
      /* The Bitget mark is an opaque tile image, so its glass layer
         sits above the tile instead of under it: no surface highlight,
         just the same treatment as the other two discs — a whisper of
         deepening toward the rim, the fine bright edge line (softest
         bright along the top arc) and the faint bottom inner shadow —
         so the black chevrons stay solid and clear beneath while the
         disc reads as cyan liquid glass. */
      .disc--bitget::after {
        z-index: 2;
        background:
          radial-gradient(circle at 50% 46%,
            rgba(255, 255, 255, 0) 52%,
            rgba(255, 255, 255, 0) 78%,
            rgba(0, 63, 92, 0.06) 92%,
            rgba(0, 63, 92, 0.12) 100%);
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.85),
          inset 0 0 0 1px rgba(255, 255, 255, 0.42),
          inset 0 -18px 26px rgba(0, 63, 92, 0.16);
      }
      .disc svg { display: block; position: relative; z-index: 1; }
      .disc img { display: block; position: relative; z-index: 1; }

      /* ---------- Labels under each disc ---------- */
      .name {
        margin: 26px 0 0;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-indent: 0.22em;
        line-height: 1.2;
      }
      .en {
        margin: 7px 0 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: var(--ink-faint);
      }
      .rank {
        margin: 15px 0 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: var(--ink-soft);
        white-space: nowrap;
      }
      .rank .no { font-weight: 800; }
      .choice--binance .rank .no { color: var(--gold-deep); }
      .choice--okx .rank .no { color: var(--ink); }
      .choice--bitget .rank .no { color: #00758c; }

      .enter {
        margin-top: 22px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 20px;
        border-radius: 999px;
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: 0.14em;
        border: 1px solid var(--hairline);
        background: rgba(255, 255, 255, 0.55);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      .choice--binance .enter { color: var(--gold-deep); }
      .choice--okx .enter { color: var(--ink); }
      .choice--bitget .enter { color: #00758c; }
      .enter .arrow { transition: transform 0.25s ease; }
      .choice:hover .enter .arrow { transform: translateX(4px); }

      /* ---------- Footnote below the cards ---------- */
      .footnote {
        margin: 44px auto 0;
        width: 100%;
        max-width: 760px;
        padding-top: 20px;
        border-top: 1px solid rgba(160, 128, 52, 0.14);
        text-align: center;
        font-size: 12.5px;
        line-height: 1.75;
        letter-spacing: 0.03em;
        color: var(--ink-faint);
      }

      /* ---------- Mobile: stack ---------- */
      @media (max-width: 639px) {
        main { padding: 40px 18px 48px; justify-content: flex-start; }
        header { margin-bottom: 34px; }
        .lang-row { margin-bottom: 20px; }
        .choices { flex-direction: column; align-items: center; gap: 22px; }
        .footnote { margin-top: 36px; font-size: 12px; }
        .choice { width: 100%; max-width: 400px; padding: 32px 22px 28px; }
        .disc { width: 168px; height: 168px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="lang-row">
        <div class="lang-switch" role="group" aria-label="Language / 語言">
          <button type="button" data-setlang="zh-CN" aria-label="简体中文">简体</button>
          <button type="button" data-setlang="zh-TW" aria-label="繁體中文">繁體</button>

          btns[i].classList.toggle("on", on);
          btns[i].setAttribute("aria-pressed", on ? "true" : "false");
        }
      }
      var langBtns = document.querySelectorAll("[data-setlang]");
      for (var j = 0; j < langBtns.length; j++) {
        langBtns[j].addEventListener("click", function () {
          applyLang(this.getAttribute("data-setlang"));
        });
      }
      applyLang(LANG);
    </script>
  </body>
</html>
