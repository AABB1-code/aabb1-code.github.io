<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#eef2f9">
<meta name="description" content="VIP专属 · 币安注册入口与热门币种实时行情。">
<title>VIP专属 · 币安注册</title>
<style>
:root{--tx:#1c1c1e;--t2:rgba(60,60,67,.64);--t3:rgba(60,60,67,.42);--y:#fcd535;--up:#1b9a43;--dn:#d92a1f;--upb:#34c759;--dnb:#ff3b30;--ac:#007aff;color-scheme:light}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{color:var(--tx);font-family:-apple-system,"SF Pro Display","SF Pro Text","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;font-size:15px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;background:#eef2f9}
a{color:inherit;text-decoration:none}
.m{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
:focus-visible{outline:2.5px solid var(--ac);outline-offset:2px}
/* 背景：近白 + 淡蓝/蜜桃/薄荷/淡紫光晕 */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(165deg,#fcfdff 0%,#f1f5fc 48%,#e8eef8 100%)}
.bg i{position:absolute;border-radius:50%;filter:blur(80px)}
.bg .o1{width:52vmax;height:52vmax;left:-18vmax;top:-18vmax;background:rgba(140,185,255,.5)}
.bg .o2{width:38vmax;height:38vmax;right:-12vmax;top:8vmax;background:rgba(255,196,165,.55)}
.bg .o3{width:40vmax;height:40vmax;left:22vw;bottom:-22vmax;background:rgba(168,240,212,.5)}
.bg .o4{width:30vmax;height:30vmax;right:18vw;top:52vh;background:rgba(205,190,255,.42)}
.bg .glow{position:absolute;right:-20vmax;top:-24vmax;width:80vmax;height:80vmax;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,1),rgba(255,251,240,.65) 36%,transparent 70%);filter:blur(24px)}
/* 玻璃基础 */
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.68),rgba(255,255,255,.34));-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),0 0 0 1px rgba(90,110,150,.08),0 24px 60px -20px rgba(60,80,130,.28),0 4px 16px rgba(60,80,130,.07)}
.glass:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;background:linear-gradient(135deg,#fff,rgba(255,255,255,.1) 34%,rgba(255,255,255,.06) 66%,rgba(255,255,255,.85));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass>*{position:relative;z-index:1}
/* 顶栏 */
header{position:sticky;top:max(10px,env(safe-area-inset-top,0px));z-index:30;max-width:1120px;margin:10px auto 0;padding:0 16px}
.bar{border-radius:999px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:6px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;margin-right:14px;white-space:nowrap;letter-spacing:-.02em}
.brand img{width:30px;height:30px;border-radius:50%;object-fit:contain;padding:3px;background:#fff;display:block;flex:none;box-shadow:0 6px 16px rgba(200,150,0,.35)}
nav.d{display:flex;align-items:center;gap:2px;flex:1}
nav.d a,nav.d button{background:none;border:0;color:var(--t2);font:inherit;font-size:14px;font-weight:650;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:36px}
nav.d a:hover,nav.d button:hover{background:rgba(255,255,255,.85);color:var(--tx)}
nav.d a.on{color:var(--tx);background:#fff;box-shadow:0 2px 10px rgba(60,80,130,.14)}
.more{position:relative}
.menu{position:absolute;top:calc(100% + 10px);left:0;min-width:190px;border-radius:22px;padding:8px;display:none}
.more.open .menu{display:block}
.menu a{display:block;padding:10px 12px;border-radius:14px;font-size:14px;color:var(--tx)}.menu a:hover{background:rgba(255,255,255,.9)}
.burger{display:none;margin-left:auto;background:rgba(255,255,255,.8);border:0;color:var(--tx);border-radius:999px;width:40px;height:40px;font-size:18px;cursor:pointer;box-shadow:0 2px 10px rgba(60,80,130,.14)}
@media(max-width:860px){nav.d{display:none}.burger{display:block}}
.drawer{position:fixed;inset:0;z-index:40;background:rgba(30,40,70,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none}
.drawer.open{display:block}
.drawer>div{position:absolute;right:10px;top:10px;bottom:10px;width:min(320px,86%);border-radius:30px;padding:22px;overflow:auto}
.drawer h3{font-size:12px;color:var(--t2);letter-spacing:.08em;margin:8px 0}
.drawer small{color:var(--t2);display:block;margin-bottom:12px}
.drawer a{display:block;padding:12px;border-radius:14px;font-weight:650}.drawer a:hover{background:rgba(255,255,255,.9)}
/* 主体 */
main{max-width:1120px;margin:0 auto;padding:26px 16px 28px}
.eb{font-size:12.5px;color:#9a7200;letter-spacing:.14em;font-weight:750}
h1{font-size:clamp(36px,5vw,54px);letter-spacing:-.03em;margin:6px 0 20px;line-height:1.08;font-weight:800}
.lab{font-size:13px;color:var(--t2);font-weight:700;margin:22px 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 26px;font:inherit;font-weight:750;font-size:15px;color:#181a20;background:linear-gradient(180deg,#ffe873,var(--y));cursor:pointer;box-shadow:0 10px 24px -6px rgba(190,145,0,.55),inset 0 1.5px 0 rgba(255,255,255,.7);transition:transform .15s,filter .15s;min-height:44px}
.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}.btn:active{transform:scale(.98)}
.btn.g{background:rgba(255,255,255,.8);color:var(--tx);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(90,110,150,.1),0 4px 14px rgba(60,80,130,.1)}
.btn.g:hover{background:#fff}
.btn.s{padding:9px 18px;font-size:13.5px;min-height:38px}
/* 邀请条 */
.invite{background:rgba(255,255,255,.62);border-radius:20px;padding:19px 22px;display:flex;align-items:center;gap:22px;flex-wrap:nowrap;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(90,110,150,.08)}
.invite-left{display:flex;flex-direction:column;align-items:flex-start;gap:10px;flex:none;min-width:0}
.invite-left>.btn{flex-shrink:0}
.invite-div{flex:none;align-self:stretch;width:1px;background:linear-gradient(180deg,transparent,rgba(90,110,150,.22) 22%,rgba(90,110,150,.22) 78%,transparent)}
.invite-lines{color:var(--t2);font-size:14px;text-align:left;line-height:1.5;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:7px}
.invite-head{font-size:17px;font-weight:750;color:var(--tx);letter-spacing:-.01em}
.invite-head b{color:#8a6400;font-size:23px;font-weight:850;letter-spacing:.06em;margin:0 6px}
.perk{display:flex;align-items:center;gap:9px;min-width:0}
.perk-dot{flex:none;width:19px;height:19px;border-radius:50%;background:linear-gradient(180deg,#ffe873,var(--y));color:#7a5800;font-size:11.5px;font-weight:900;line-height:1;display:grid;place-items:center;box-shadow:inset 0 1px 0 #fff,0 2px 6px rgba(190,145,0,.35)}
.perk .hl{font-family:Georgia,"Times New Roman","Songti SC","STSong","SimSun",serif;font-size:1.3em;font-weight:800;letter-spacing:.02em;line-height:1.25;white-space:nowrap;vertical-align:baseline;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;background:linear-gradient(180deg,#111 0%,#1a1607 55%,#8a6400 78%,#c1920a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
@media(max-width:560px){
  .invite{padding:16px;gap:12px;flex-direction:column;align-items:stretch}
  .invite-left{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
  .invite-div{width:auto;height:1px;align-self:auto;background:linear-gradient(90deg,transparent,rgba(90,110,150,.22) 22%,rgba(90,110,150,.22) 78%,transparent)}
  .invite-lines{font-size:13px;line-height:1.55;gap:8px;width:100%}
  .invite-head{font-size:15.5px}
  .invite-head b{font-size:20px;margin:0 4px}
  /* 福利行：勾点固定宽成列、顶对齐首行；文字区 flex 承接换行，续行与首行文字左边缘齐（悬挂缩进） */
  .perk{align-items:flex-start;gap:8px;line-height:1.55}
  .perk-dot{flex:0 0 18px;width:18px;height:18px;font-size:10.5px;margin-top:1px}
  .perk>span:last-child{flex:1 1 auto;min-width:0;line-height:1.55}
  .perk .hl{font-size:1.18em;line-height:inherit;vertical-align:baseline;letter-spacing:0}
  .invite-left>.btn{padding:9px 15px}
  /* 邀请条与下一节标题拉开间距，标题不被卡片压住 */
  .invite+.lab{margin-top:30px}
}
/* 热门币种（注册区下方通栏横排） */
.hot{margin-top:20px;border-radius:34px;padding:26px 28px}
@media(max-width:560px){.hot{padding:20px}}
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.hd h2{font-size:20px;display:flex;align-items:center;gap:10px;letter-spacing:-.02em;flex-wrap:wrap}
.live{font-size:12px;color:var(--t2);display:inline-flex;align-items:center;gap:6px;font-weight:650;background:rgba(255,255,255,.7);padding:5px 11px;border-radius:999px;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(90,110,150,.08)}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:#b0b6bf;flex:none}
.live.on{color:var(--up)}.live.on:before{background:var(--upb);box-shadow:0 0 0 3px rgba(52,199,89,.22);animation:pu 1.8s infinite}
.live.bad{color:var(--dn)}.live.bad:before{background:var(--dnb)}
@keyframes pu{50%{box-shadow:0 0 0 6px rgba(52,199,89,0)}}
.hd>a{color:#0062cc;font-size:14px;font-weight:650;padding-top:4px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.coin .meta{font-size:10.5px}.meta-pre{display:none}}
.coin{border-radius:20px;padding:14px 16px;transition:transform .2s,box-shadow .2s;min-width:0;display:flex;flex-direction:column}
.coin:hover{transform:translateY(-2px)}
.coin .t{display:flex;justify-content:space-between;align-items:baseline;font-weight:750;gap:8px;white-space:nowrap}
.coin .t b{font-size:15px}
.coin .t span{font-size:12px;font-weight:750;margin-left:auto}
.coin .p{font-size:16px;font-weight:800;margin:6px 0 4px;letter-spacing:-.02em;border-radius:8px;padding:0 4px;margin-left:-4px;white-space:nowrap}
.coin .meta{font-size:11px;color:var(--t3);font-weight:600;white-space:nowrap;overflow:hidden;margin-bottom:8px}
.coin svg{width:100%;height:30px;display:block;margin-top:auto}
.fu{animation:fu .9s}.fd{animation:fd .9s}
@keyframes fu{from{background:rgba(52,199,89,.4)}}@keyframes fd{from{background:rgba(255,59,48,.35)}}
.downbar{margin-top:12px;background:rgba(255,236,234,.8);border:1px solid rgba(217,42,31,.28);color:#8f1d14;border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.65;display:none;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.downbar.on{display:flex}
.downbar span{flex:1;min-width:200px}
/* 信任 + SAFU */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
@media(max-width:760px){.badges{grid-template-columns:1fr}}
.badge{border-radius:28px;padding:20px;display:flex;gap:14px;align-items:center;font-size:14px;color:var(--t2);line-height:1.6}
.safu{margin-top:20px;border-radius:34px;padding:32px}
.safu h2{font-size:25px;margin-bottom:8px;letter-spacing:-.02em}
.safu p{color:var(--t2);max-width:640px}
.safu .st{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
@media(max-width:700px){.safu .st{grid-template-columns:1fr}}
.safu .st div{background:rgba(255,255,255,.6);border-radius:18px;padding:16px;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(90,110,150,.07)}
.safu .st b{display:block;font-size:24px;color:#9a7200}.safu .st span{font-size:12.5px;color:var(--t2)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid #fff;box-shadow:0 16px 40px rgba(40,70,130,.22);color:var(--tx);padding:12px 22px;border-radius:999px;font-size:14px;font-weight:650;transition:all .3s;z-index:60;max-width:calc(100% - 40px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* 白玻璃贵气面板：强模糊 + 香槟金光晕 + 极淡金色细线 + 细金边 */
.royal{border-radius:34px;padding:38px 36px;color:var(--tx);background:radial-gradient(120% 90% at 85% 0%,rgba(240,185,11,.16),transparent 55%),radial-gradient(90% 70% at 8% 100%,rgba(255,214,120,.12),transparent 60%),repeating-linear-gradient(180deg,rgba(185,126,4,.05) 0,rgba(185,126,4,.05) 1px,transparent 1px,transparent 24px),linear-gradient(160deg,rgba(255,255,255,.82),rgba(255,255,255,.52));-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(185,126,4,.38);box-shadow:0 24px 60px -20px rgba(60,80,130,.28),0 4px 16px rgba(60,80,130,.07),inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.35)}
@media(max-width:900px){.royal{padding:28px 24px}}
.royal .eb{color:#9a7200;letter-spacing:.34em}
.royal h1{color:#181a20}
.gold-text{background:linear-gradient(180deg,#f2c230 0%,#dfa106 55%,#b97e04 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
/* 黑金渐变：黑约 55% 转金、末端 #c1920a —— 标题、数据行说明、邀请高亮共用 */
.black-gold,.royal .rbig span{background:linear-gradient(180deg,#111 0%,#1a1607 55%,#8a6400 78%,#c1920a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
/* 数据行：大号数字 + 同行说明（基线对齐），右侧两个月桂 No.1 */
.rstats{display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap;margin-bottom:24px}
.rbig{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.rbig b{font-size:clamp(46px,6vw,66px);font-weight:850;letter-spacing:-.02em;line-height:1}
.rbig span{color:#1c1c1e;font-weight:800;font-size:clamp(17px,2.2vw,23px);line-height:1.25;letter-spacing:.02em;white-space:nowrap}
.rno1s{display:flex;gap:clamp(18px,4vw,48px);flex-wrap:wrap}
.rno1{display:flex;align-items:center;gap:4px}
.rno1-mid{text-align:center}
.rno1-mid b{display:block;font-size:clamp(30px,4vw,44px);font-weight:850;line-height:1.05}
.rno1-mid span{display:block;color:#9a7200;font-size:13px;font-weight:650;letter-spacing:.18em;margin-top:5px}
.laurel{flex:none}
/* 邀请条（贵气面板内）：白玻璃 + 金边 */
.royal .invite{background:rgba(255,255,255,.55);border:1px solid rgba(185,126,4,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 14px rgba(60,80,130,.06)}
.royal .invite-head{color:var(--tx)}
.royal .invite-head b{color:#9a7200}
.royal .invite-lines{color:var(--t2)}
.royal .invite-div{background:linear-gradient(180deg,transparent,rgba(185,126,4,.35) 22%,rgba(185,126,4,.35) 78%,transparent)}
.royal .lab{color:#9a7200}
.royal .btn.g{background:rgba(255,255,255,.75);color:var(--tx);box-shadow:inset 0 0 0 1px rgba(185,126,4,.5),inset 0 1px 0 rgba(255,255,255,.9),0 4px 14px rgba(60,80,130,.08)}
.royal .btn.g:hover{background:#fff}
.royal .invite .btn{background:linear-gradient(180deg,#ffe873,var(--y));color:#181a20;box-shadow:0 10px 24px -6px rgba(190,145,0,.55),inset 0 1.5px 0 rgba(255,255,255,.7)}
.royal .invite .btn:hover{background:linear-gradient(180deg,#ffe873,var(--y));filter:brightness(1.04)}
@media(max-width:560px){
  .royal{padding:26px 20px}
  .rstats{flex-direction:column;align-items:flex-start;gap:22px}
  .rno1s{gap:20px}
  .laurel{width:24px;height:48px}
  .royal .invite-div{background:linear-gradient(90deg,transparent,rgba(185,126,4,.35) 22%,rgba(185,126,4,.35) 78%,transparent)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

$("dnav").innerHTML=`<h3>站点</h3>`+CONFIG.nav.map(a=>nl(a)).join("")+`<h3>更多</h3>`+CONFIG.more.map(a=>nl(a)).join("");
document.addEventListener("click",e=>{const a=e.target.closest("[data-soon]");if(a){e.preventDefault();toast("该页面即将上线")}
  const mb=e.target.closest("#mb");$("more").classList.toggle("open",!!mb&&!$("more").classList.contains("open"));
  if(e.target.closest("#burger"))$("drawer").classList.add("open");else if(!e.target.closest("#dnav")&&e.target.closest("#drawer")||e.target.closest("#dnav a"))$("drawer").classList.remove("open")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("more").classList.remove("open");$("drawer").classList.remove("open")}});
// 邀请相关链接
document.querySelectorAll("[data-l]").forEach(a=>{const u=CONFIG.links[a.dataset.l];
  if(!u){a.classList.add("pending");a.addEventListener("click",e=>{e.preventDefault();toast("该链接还没有配置")});return}
  a.href=u;a.target="_blank";a.rel="noopener sponsored"});
$("copy").onclick=async()=>{const c=CONFIG.inviteCode;if(!c)return toast("邀请码还没有配置");try{await navigator.clipboard.writeText(c)}catch(e){const t=document.createElement("textarea");t.value=c;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}toast("已复制邀请码："+c)};
// 荣誉 / SAFU
const AWARD='<svg width="44" height="44" viewBox="0 0 48 48" fill="none" aria-hidden="true" style="flex:none"><circle cx="24" cy="19" r="11" stroke="#b8860b" stroke-width="2.4"/><path d="M24 12.5l1.9 3.9 4.3.6-3.1 3 0.7 4.3L24 22.3l-3.8 2-0.7-4.3-3.1-3 4.3-.6z" fill="#fcd535"/><path d="M18.5 27.5L15 40l9-4.6L33 40l-3.5-12.5" stroke="#b8860b" stroke-width="2.4" stroke-linejoin="round"/></svg>';
$("badges").innerHTML=CONFIG.badges.map(b=>`<div class="badge glass">${AWARD}<span>${b}</span></div>`).join("");if(!CONFIG.badges.length)$("badges").style.display="none";
$("safu").innerHTML=`<h2>${CONFIG.safu.title}</h2><p>${CONFIG.safu.text}</p>`+(CONFIG.safu.stats.length?`<div class="st">${CONFIG.safu.stats.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join("")}</div>`:"")+(CONFIG.safu.wallet?`<p class="m" style="margin-top:16px;font-size:12.5px;word-break:break-all">${CONFIG.safu.wallet}</p>`:"");

/* ---------- 实时热门币种：币安 WebSocket 直播推价（无 CORS 限制）+ 七家跨域直连 REST 并行竞速（币安 / OKX / Gate / Bitget / Binance US / HTX / CoinGecko，均已实测放行跨域）；直连全失败再走公开中转（AllOrigins / Codetabs）兜底。REST 每 5 秒一轮，拉不到显示 --，绝不编价 ---------- */
const COINS=["BTC","ETH","BNB","SOL","XRP"];
const CG_IDS={BTC:"bitcoin",ETH:"ethereum",BNB:"binancecoin",SOL:"solana",XRP:"ripple"};
const CG_URL="https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,binancecoin,solana,ripple&vs_currencies=usd&include_24hr_change=true";
const tk={},pv={},sp={},hist={},tkAt={};let lastMsg=0,srcName="",everOk=false,failed=false,roundBusy=false,roundDone=false;
const dp=v=>v>=1000?2:v>=10?2:v>=1?3:v>=.01?5:7,f=v=>"$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:dp(v),maximumFractionDigits:dp(v)}),pc=v=>(v>=0?"+":"")+v.toFixed(2)+"%";
function priceFontSize(text){const len=text.length;if(len<=9)return 16;if(len<=11)return 14.5;if(len<=13)return 13;return 11.5}
$("grid").innerHTML=COINS.map(c=>`<div class="coin glass" id="c${c}"><div class="t"><b>${c}</b><span class="m">--</span></div><div class="p m">--</div><div class="meta">连接中</div><svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"></svg></div>`).join("");
function spark(a,up){if(!a||a.length<2)return"";const mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1,d=a.map((v,i)=>(i?"L":"M")+(i/(a.length-1)*100).toFixed(1)+" "+(3+(1-(v-mn)/r)*24).toFixed(1)).join("");return`<path d="${d}" fill="none" stroke="${up?"#34c759":"#ff3b30"}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`}
function draw(){COINS.forEach(c=>{const q=tk[c],el=$("c"+c);if(!el)return;const p=el.querySelector(".p"),s=el.querySelector(".t span"),mt=el.querySelector(".meta");
  if(!q){if(failed&&!everOk){p.textContent="拉取失败";p.style.fontSize="13px";s.textContent="--";mt.textContent="重试中"}return}
  const pct=q.pct!=null?q.pct:(q.p-q.o)/q.o*100,up=pct>=0;const ptxt=f(q.p);p.textContent=ptxt;p.style.fontSize=priceFontSize(ptxt)+"px";
  s.textContent=pc(pct);s.className="m "+(up?"up":"dn");
  const at=tkAt[c]||lastMsg;mt.innerHTML=`<span class="meta-pre">来源 · </span>${q.src||srcName||"实时"} · ${at?Math.max(0,Math.round((performance.now()-at)/1000)):0}秒前更新`;
  if(pv[c]!=null&&pv[c]!==q.p){p.classList.remove("fu","fd");void p.offsetWidth;p.classList.add(q.p>pv[c]?"fu":"fd")}pv[c]=q.p;
  const line=(sp[c]&&sp[c].length>1)?sp[c]:hist[c];
  el.querySelector("svg").innerHTML=spark(line,up)})}
async function ft(u,ms){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms||6000);let r;try{r=await fetch(u,{signal:ctl.signal})}catch(e){throw new Error(e&&e.name==="AbortError"?"请求超时":"网络不通/CORS拦截")}finally{clearTimeout(t)}
  if(!r.ok)throw new Error("HTTP "+r.status);try{return await r.json()}catch(e){throw new Error("返回数据格式异常")}}
const RANGE={BTC:[10000,200000],ETH:[200,10000],BNB:[50,2000],SOL:[5,1000],XRP:[.05,10]};
const pend={};
function setQ(c,p,pct,src){if(!COINS.includes(c)||!(p>0)||pct==null||!isFinite(pct))return false;
  const rg=RANGE[c];if(p<rg[0]||p>rg[1])return false;
  const cur=tk[c];
  if(cur&&performance.now()-(tkAt[c]||0)<30000&&Math.abs(p-cur.p)/cur.p>.02){const pd=pend[c];
    if(pd&&Math.abs(p-pd.p)/pd.p<.005){pd.n++;if(pd.n<2)return false}
    else{pend[c]={p,n:1};return false}}
  pend[c]=null;const o=p/(1+pct/100||1);tk[c]={p,o,pct,src};tkAt[c]=performance.now();lastMsg=tkAt[c];srcName=src;everOk=true;failed=false;
  if(sp[c]&&sp[c].length>1)sp[c][sp[c].length-1]=p;
  const h=hist[c]||(hist[c]=[]);if(!h.length||h[h.length-1]!==p){h.push(p);if(h.length>48)h.shift()}
  return true}
/* 解析 CoinGecko simple/price 返回：逐币过 setQ 校验后写入，返回成功币数；上游限流体直接抛错 */
function cgParse(j,src){if(!j||typeof j!=="object")throw new Error("返回数据格式异常");
  if(j.status&&j.status.error_code)throw new Error("上游限流 HTTP "+j.status.error_code);
  let n=0;COINS.forEach(c=>{const x=j[CG_IDS[c]];if(x&&+x.usd>0&&x.usd_24h_change!=null&&setQ(c,+x.usd,+x.usd_24h_change,src))n++});
  if(!n)throw new Error("返回数据缺少币种价格");return n}
/* 直连源（优先）：七家都允许跨域直连（已逐个实测 ACAO 放行），一次并行发出，哪个先返回有效价就先用 */
const DIRECT=[
 {name:"币安",fn:async()=>{const j=await ft("https://data-api.binance.vision/api/v3/ticker/24hr?symbols="+encodeURIComponent(JSON.stringify(COINS.map(c=>c+"USDT"))));if(!Array.isArray(j)||!j.length)throw new Error("空数据");let n=0;j.forEach(x=>{const c=x.symbol.replace("USDT","");if(COINS.includes(c)&&setQ(c,+x.lastPrice,+x.priceChangePercent,"币安"))n++});if(!n)throw new Error("空数据");return n}},
 {name:"OKX",fn:async()=>{const rs=await Promise.allSettled(COINS.map(c=>ft("https://www.okx.com/api/v5/market/ticker?instId="+c+"-USDT")));let n=0;rs.forEach((r,i)=>{if(r.status!=="fulfilled"||r.value.code!=="0"||!r.value.data||!r.value.data.length)return;const x=r.value.data[0],pr=+x.last,o=+x.open24h;if(pr>0&&o>0&&setQ(COINS[i],pr,(pr-o)/o*100,"OKX"))n++});if(!n)throw new Error("空数据");return n}},
 {name:"Gate",fn:async()=>{const rs=await Promise.allSettled(COINS.map(c=>ft("https://api.gateio.ws/api/v4/spot/tickers?currency_pair="+c+"_USDT")));let n=0;rs.forEach((r,i)=>{if(r.status!=="fulfilled"||!Array.isArray(r.value)||!r.value.length)return;const x=r.value[0];if(setQ(COINS[i],+x.last,+x.change_percentage,"Gate"))n++});if(!n)throw new Error("空数据");return n}},
 {name:"Bitget",fn:async()=>{const rs=await Promise.allSettled(COINS.map(c=>ft("https://api.bitget.com/api/v2/spot/market/tickers?symbol="+c+"USDT")));let n=0;rs.forEach((r,i)=>{if(r.status!=="fulfilled"||r.value.code!=="00000"||!r.value.data||!r.value.data.length)return;const x=r.value.data[0];if(setQ(COINS[i],+x.lastPr,+x.change24h*100,"Bitget"))n++});if(!n)throw new Error("空数据");return n}},
 {name:"Binance US",fn:async()=>{const j=await ft("https://api.binance.us/api/v3/ticker/24hr?symbols="+encodeURIComponent(JSON.stringify(COINS.map(c=>c+"USD"))));if(!Array.isArray(j)||!j.length)throw new Error("空数据");let n=0;j.forEach(x=>{const c=x.symbol.replace(/USD$/,"");if(COINS.includes(c)&&setQ(c,+x.lastPrice,+x.priceChangePercent,"Binance US"))n++});if(!n)throw new Error("空数据");return n}},
 {name:"HTX",fn:async()=>{const rs=await Promise.allSettled(COINS.map(c=>ft("https://api.huobi.pro/market/detail/merged?symbol="+c.toLowerCase()+"usdt")));let n=0;rs.forEach((r,i)=>{if(r.status!=="fulfilled"||r.value.status!=="ok"||!r.value.tick)return;const x=r.value.tick;if(+x.close>0&&+x.open>0&&setQ(COINS[i],+x.close,(+x.close-+x.open)/+x.open*100,"HTX"))n++});if(!n)throw new Error("空数据");return n}},
 {name:"CoinGecko",fn:async()=>cgParse(await ft(CG_URL,8000),"CoinGecko")}
];
/* 中转兜底（仅直连全失败或缺币时）：公开中转拉 CoinGecko */
const RELAYS=[
 {name:"AllOrigins",url:u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u)},
 {name:"Codetabs",url:u=>"https://api.codetabs.com/v1/proxy?quest="+u},
 {name:"Codetabs·编码",url:u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u)},
 {name:"AllOrigins·get",url:u=>"https://api.allorigins.win/get?url="+encodeURIComponent(u),wrap:j=>{if(j&&typeof j.contents==="string"){try{return JSON.parse(j.contents)}catch(e){throw new Error("中转包装解析失败")}}throw new Error("中转返回格式异常")}}
];
/* 一轮：直连七家并行竞速 → 仍缺币才走中转补齐；轮询永不停 */
async function priceRound(){if(roundBusy)return;roundBusy=true;const t0=performance.now();
  const missing=()=>COINS.filter(c=>!(tkAt[c]>=t0));
  try{
    await Promise.allSettled(DIRECT.map(s=>s.fn()));
    if(missing().length){
      await Promise.allSettled(RELAYS.map(async r=>{let j=await ft(r.url(CG_URL),10000);if(r.wrap)j=r.wrap(j);cgParse(j,"中转·"+r.name)}));
    }
  }catch(e){}
  roundBusy=false;roundDone=true;
  if(!everOk)failed=true;else if(COINS.some(c=>tkAt[c]>=t0))failed=false;
  draw()}
/* 迷你 K 线：CoinGecko market_chart 当日价格，直连优先、失败走 AllOrigins 中转（约 5 分钟一点，下采样到约 48 点画线）；拉不到时 draw() 用实时价历史兜底，不留空白 */
async function sparks(){await Promise.all(COINS.map(async c=>{if(sp[c]&&sp[c].length>1)return;
  const url="https://api.coingecko.com/api/v3/coins/"+CG_IDS[c]+"/market_chart?vs_currency=usd&days=1";
  const apply=j=>{if(j&&Array.isArray(j.prices)&&j.prices.length>1){const all=j.prices.map(x=>+x[1]).filter(v=>v>0),step=Math.max(1,Math.floor(all.length/48)),pts=[];for(let i=0;i<all.length;i+=step)pts.push(all[i]);if(all.length&&pts[pts.length-1]!==all[all.length-1])pts.push(all[all.length-1]);sp[c]=pts;if(tk[c])sp[c][sp[c].length-1]=tk[c].p;return true}return false};
  try{if(apply(await ft(url,9000)))return}catch(e){}
  try{apply(await ft("https://api.allorigins.win/raw?url="+encodeURIComponent(url),10000))}catch(e){}}))}
/* 币安 WebSocket 直播：WebSocket 不受 CORS 限制，连上后逐秒推价（仍过 setQ 同一套校验）；断线自动重连，连不上不影响 REST 轮询兜底 */
(function wsLive(){const streams=COINS.map(c=>c.toLowerCase()+"usdt@miniTicker").join("/");let ws=null;
  function conn(){try{ws=new WebSocket("wss://data-stream.binance.vision/ws/"+streams)}catch(e){setTimeout(conn,5000);return}
    ws.onmessage=ev=>{try{const j=JSON.parse(ev.data),d=j&&j.data?j.data:j,arr=Array.isArray(d)?d:[d];let hit=false;
      arr.forEach(x=>{if(!x||!x.s)return;const c=x.s.replace(/USDT$/,""),p=+x.c,o=+x.o;if(COINS.includes(c)&&p>0&&o>0&&setQ(c,p,(p-o)/o*100,"币安直播"))hit=true});
      if(hit)draw()}catch(e){}};
    ws.onclose=()=>setTimeout(conn,4000);
    ws.onerror=()=>{try{ws.close()}catch(e){}}}
  conn()})();
/* 启动：立即跑第一轮 → 迷你线 */
priceRound().catch(()=>{});sparks().catch(()=>{});
/* 每 5 秒一轮直连竞速；失败不停止，5 秒后自动重试 */
setInterval(()=>{priceRound().catch(()=>{})},5000);
/* 迷你线缺失时每 30 秒补拉一次 */
setInterval(()=>{if(!COINS.every(c=>sp[c]&&sp[c].length>1))sparks().catch(()=>{})},30000);
/* 重试按钮：立刻再跑一轮并补拉迷你线 */
$("retry").onclick=()=>{priceRound().catch(()=>{});sparks().catch(()=>{})};
/* 状态点：每秒刷新；显示实际来源与「X秒前更新」，超过 30 秒没成功标「数据延迟」 */
setInterval(()=>{const n=performance.now(),age=lastMsg?n-lastMsg:999999;
  const lv=$("live"),ageS=Math.max(0,Math.round(age/1000));
  if(everOk&&age<=30000){lv.className="live on";lv.textContent="实时 · "+(srcName||"直连")+" · "+ageS+"秒前更新"}
  else if(everOk){lv.className="live bad";lv.textContent="数据延迟 · "+ageS+"秒前更新"}
  else if(failed){lv.className="live bad";lv.textContent="拉取失败 · 重试中"}
  else{lv.className="live";lv.textContent="连接中…"}
  $("downbar").classList.toggle("on",(roundDone&&!everOk)||(everOk&&age>30000));
  draw()},1000);
</script>
