<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!-- Empty inline icon: stops the browser fetching /favicon.ico, which
         lives outside the artifact's routes and 404s. -->
    <link rel="icon" href="data:," />
    <title>VIP专属 · 交易所选择</title>
    <style>
      :root {
        --ink: #1c1e24;
        --ink-soft: #4a4e57;
        --ink-faint: #8a8f98;
        --gold: #c9962e;
        --gold-deep: #9a6b14;
        --gold-bright: #f0b90b;
        --hairline: rgba(160, 128, 52, 0.22);
        --glass: rgba(255, 255, 255, 0.62);
        --glass-edge: rgba(255, 255, 255, 0.85);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1100px 620px at 12% -10%, rgba(240, 185, 11, 0.10), rgba(240, 185, 11, 0) 60%),
          radial-gradient(1000px 640px at 92% 108%, rgba(70, 84, 110, 0.10), rgba(70, 84, 110, 0) 62%),
          linear-gradient(168deg, #fdfdfe 0%, #f4f5f7 52%, #eef0f3 100%);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 20px 56px;
        animation: rise 0.7s cubic-bezier(0.22, 0.9, 0.3, 1) both;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        main { animation: none; }
        .choice, .disc, .enter .arrow { transition: none !important; }
      }

      /* ---------- Language switch (same pill as the Binance / OKX pages) ---------- */
      .lang-row {
        width: 100%;
        max-width: 760px;
        display: flex;
        justify-content: flex-end;
        margin-bottom: 26px;
      }
      .lang-switch {
        display: flex;
        align-items: center;
        gap: 2px;
        background: rgba(255, 255, 255, 0.55);
        border-radius: 999px;
        padding: 3px;
        box-shadow: inset 0 1px 0 #fff, 0 0 0 1px rgba(160, 128, 52, 0.18);
        backdrop-filter: blur(14px) saturate(1.4);
        -webkit-backdrop-filter: blur(14px) saturate(1.4);
        flex: none;
      }
      .lang-switch button {
        background: none;
        border: 0;
        font: inherit;
        font-size: 12.5px;
        font-weight: 650;
        color: var(--ink-faint);
        padding: 6px 12px;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        min-height: 36px;
        line-height: 1.2;
        -webkit-tap-highlight-color: transparent;
      }
      .lang-switch button:hover { color: var(--ink); }
      .lang-switch button.on {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 2px 8px rgba(60, 80, 130, 0.16);
      }
      .lang-switch button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      /* English strings are longer: ease the title tracking and let the
         rank lines wrap inside their cards instead of overflowing. */
      html[lang="en"] h1 { letter-spacing: 0.05em; text-indent: 0.05em; }
      html[lang="en"] .rank { white-space: normal; }

      /* ---------- Heading ---------- */
      header { text-align: center; margin-bottom: 46px; }
      h1 {
        margin: 0;
        font-size: clamp(40px, 8vw, 58px);
        font-weight: 800;
        letter-spacing: 0.14em;
        text-indent: 0.14em;
        line-height: 1.15;
        /* Glassy noble title: semi-transparent ink with a champagne-gold
           sheen running through it, a faint gold halo behind the glyphs. */
        background: linear-gradient(158deg,
          rgba(28, 30, 36, 0.94) 0%,
          rgba(28, 30, 36, 0.82) 38%,
          rgba(146, 110, 38, 0.88) 72%,
          rgba(28, 30, 36, 0.92) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        filter:
          drop-shadow(0 1px 0 rgba(255, 255, 255, 0.65))
          drop-shadow(0 0 16px rgba(201, 150, 46, 0.20));
      }
      .subtitle {
        margin: 14px 0 0;
        font-size: 15px;
        letter-spacing: 0.06em;
        color: var(--ink-faint);
      }
      .subtitle .code {
        font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        font-weight: 700;
        font-size: 1.12em;
        letter-spacing: 0.08em;
        background: linear-gradient(100deg, #23242a 20%, #6d5212 52%, #b8860b 78%, #2a2416 105%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      /* ---------- Choices ---------- */
      .choices {
        display: flex;
        gap: clamp(20px, 5vw, 56px);
        align-items: stretch;
        justify-content: center;
        flex-wrap: wrap;
        width: 100%;
        max-width: 760px;
      }
      .choice {
        flex: 1 1 280px;
        max-width: 340px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        text-decoration: none;
        color: inherit;
        padding: 38px 26px 32px;
        border-radius: 32px;
        background: var(--glass);
        border: 1px solid var(--hairline);
        box-shadow:
          inset 0 1px 0 var(--glass-edge),
          0 18px 44px rgba(31, 35, 44, 0.08),
          0 3px 10px rgba(31, 35, 44, 0.05);
        backdrop-filter: blur(18px) saturate(1.5);
        -webkit-backdrop-filter: blur(18px) saturate(1.5);
        transition: transform 0.28s cubic-bezier(0.22, 0.9, 0.3, 1), box-shadow 0.28s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .choice:hover {
        transform: translateY(-5px);
        box-shadow:
          inset 0 1px 0 var(--glass-edge),
          0 28px 56px rgba(31, 35, 44, 0.13),
          0 6px 16px rgba(31, 35, 44, 0.07);
      }
      .choice:active { transform: translateY(-1px) scale(0.975); }
      .choice:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 4px;
      }

      /* ---------- The big discs ---------- */
      .disc {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        flex: none;
        transition: transform 0.28s cubic-bezier(0.22, 0.9, 0.3, 1);
      }
      .choice:hover .disc { transform: scale(1.035); }
      .choice:active .disc { transform: scale(0.97); }
      .disc::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: linear-gradient(155deg, rgba(255, 255, 255, 0.58) 0%, rgba(255, 255, 255, 0.16) 34%, rgba(255, 255, 255, 0) 55%);
        pointer-events: none;
      }
      /* Fine champagne-gold hairline ring on both discs: the glass edge.
         Sits at the perimeter only, never over the icon. */
      .disc::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px rgba(201, 150, 46, 0.38);
        pointer-events: none;
      }
      .disc--binance {
        background:
          linear-gradient(155deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.16) 30%, rgba(255, 255, 255, 0) 52%),
          radial-gradient(circle at 32% 24%, #fff3c4 0%, #ffd94d 26%, #f0b90b 55%, #d99a06 78%, #b57e04 100%);
        box-shadow:
          inset 0 2px 3px rgba(255, 255, 255, 0.7),
          inset 0 -12px 24px rgba(146, 96, 0, 0.35),
          inset 0 0 0 1px rgba(184, 134, 11, 0.45),
          0 0 44px rgba(240, 185, 11, 0.45),
          0 16px 34px rgba(146, 96, 0, 0.28);
      }
      .disc--binance svg { filter: drop-shadow(0 2px 4px rgba(110, 72, 0, 0.62)) drop-shadow(0 0 1px rgba(122, 84, 0, 0.55)); }
      .disc--okx {
        background: radial-gradient(circle at 32% 26%, #3d4149 0%, #1d1f24 46%, #0c0d10 100%);
        box-shadow:
          inset 0 2px 3px rgba(255, 255, 255, 0.35),
          inset 0 -10px 22px rgba(0, 0, 0, 0.55),
          0 16px 34px rgba(12, 13, 16, 0.34);
      }
      .disc svg { display: block; position: relative; z-index: 1; }

      /* ---------- Labels under each disc ---------- */
      .name {
        margin: 26px 0 0;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-indent: 0.22em;
        line-height: 1.2;
      }
      .en {
        margin: 7px 0 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: var(--ink-faint);
      }
      .rank {
        margin: 15px 0 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: var(--ink-soft);
        white-space: nowrap;
      }
      .rank .no { font-weight: 800; }
      .choice--binance .rank .no { color: var(--gold-deep); }
      .choice--okx .rank .no { color: var(--ink); }

      .enter {
        margin-top: 22px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 20px;
        border-radius: 999px;
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: 0.14em;
        border: 1px solid var(--hairline);
        background: rgba(255, 255, 255, 0.55);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      .choice--binance .enter { color: var(--gold-deep); }
      .choice--okx .enter { color: var(--ink); }
      .enter .arrow { transition: transform 0.25s ease; }
      .choice:hover .enter .arrow { transform: translateX(4px); }

      /* ---------- Mobile: stack ---------- */
      @media (max-width: 639px) {
        main { padding: 40px 18px 48px; justify-content: flex-start; }
        header { margin-bottom: 34px; }
        .lang-row { margin-bottom: 20px; }
        .choices { flex-direction: column; align-items: center; gap: 22px; }
        .choice { width: 100%; max-width: 400px; padding: 32px 22px 28px; }
        .disc { width: 168px; height: 168px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="lang-row">
        <div class="lang-switch" role="group" aria-label="Language / 語言">
          <button type="button" data-setlang="zh-CN" aria-label="简体中文">简体</button>
          <button type="button" data-setlang="zh-TW" aria-label="繁體中文">繁體</button>
          <button type="button" data-setlang="en" aria-label="English">EN</button>
        </div>
      </div>

      <header>
        <h1 id="tTitle">VIP专属</h1>
        <p class="subtitle"><span id="tSubPre">邀请码</span> <span class="code">AABB1</span> <span id="tSubPost">· 币安、欧易通用</span></p>
      </header>

      <nav class="choices" id="tNav" aria-label="选择交易所">
        <a class="choice choice--binance" id="tBnLink" href="https://AABB1-code.github.io/binance/" aria-label="进入币安 Binance 注册页">
          <span class="disc disc--binance" aria-hidden="true">
            <svg width="124" height="124" viewBox="0 0 200 200" role="img" id="tBnLogo" aria-label="币安 Binance 标志">
              <g fill="#c49008" stroke="#8a5f04" stroke-width="1.6" stroke-linejoin="round">
                <path d="M100 10 L145 55 L130 70 L100 40 L70 70 L55 55 Z" />
                <path d="M100 190 L55 145 L70 130 L100 160 L130 130 L145 145 Z" />
                <path d="M100 82 L118 100 L100 118 L82 100 Z" />
                <path d="M37 82 L55 100 L37 118 L19 100 Z" />
                <path d="M163 82 L181 100 L163 118 L145 100 Z" />
              </g>
            </svg>
          </span>
          <span class="name" id="tBnName">币安</span>
          <span class="en">BINANCE</span>
          <span class="rank" id="tBnRank">全球最大交易所</span>
          <span class="enter"><span id="tBnEnter">进入</span> <span class="arrow">→</span></span>
        </a>

        <a class="choice choice--okx" id="tOkLink" href="https://AABB1-code.github.io/okx/" aria-label="进入欧易 OKX 注册页">
          <span class="disc disc--okx" aria-hidden="true">
            <svg width="86" height="86" viewBox="0 0 86 86" role="img" id="tOkLogo" aria-label="OKX 标志">
              <g fill="#ffffff">
                <rect x="2" y="2" width="24" height="24" rx="5" />
                <rect x="60" y="2" width="24" height="24" rx="5" />
                <rect x="31" y="31" width="24" height="24" rx="5" />
                <rect x="2" y="60" width="24" height="24" rx="5" />
                <rect x="60" y="60" width="24" height="24" rx="5" />
              </g>
            </svg>
          </span>
          <span class="name" id="tOkName">欧易</span>
          <span class="en">OKX</span>
          <span class="rank" id="tOkRank">全球第二大交易所</span>
          <span class="enter"><span id="tOkEnter">进入</span> <span class="arrow">→</span></span>
        </a>
      </nav>
    </main>

    <script>
      /* ---------- 三语切换：与币安页 / 欧易页共用同一个记住键 vip-lang ---------- */
      var I18N = {
        "zh-CN": {
          docTitle: "VIP专属 · 交易所选择",
          title: "VIP专属",
          subPre: "邀请码",
          subPost: "· 币安、欧易通用",
          navLabel: "选择交易所",
          bnName: "币安",
          bnRank: "全球最大交易所",
          bnEnter: "进入",
          bnAria: "进入币安 Binance 注册页",
          bnLogo: "币安 Binance 标志",
          okName: "欧易",
          okRank: "全球第二大交易所",
          okEnter: "进入",
          okAria: "进入欧易 OKX 注册页",
          okLogo: "OKX 标志"
        },
        "zh-TW": {
          docTitle: "VIP專屬 · 交易所選擇",
          title: "VIP專屬",
          subPre: "邀請碼",
          subPost: "· 幣安、歐易通用",
          navLabel: "選擇交易所",
          bnName: "幣安",
          bnRank: "全球最大交易所",
          bnEnter: "進入",
          bnAria: "進入幣安 Binance 註冊頁",
          bnLogo: "幣安 Binance 標誌",
          okName: "歐易",
          okRank: "全球第二大交易所",
          okEnter: "進入",
          okAria: "進入歐易 OKX 註冊頁",
          okLogo: "OKX 標誌"
        },
        "en": {
          docTitle: "VIP Exclusive · Choose an Exchange",
          title: "VIP Exclusive",
          subPre: "Invite Code",
          subPost: "· Works for Binance and OKX",
          navLabel: "Choose an exchange",
          bnName: "Binance",
          bnRank: "The World's Largest Exchange",
          bnEnter: "Enter",
          bnAria: "Go to the Binance registration page",
          bnLogo: "Binance logo",
          okName: "OKX",
          okRank: "The World's 2nd Largest Exchange",
          okEnter: "Enter",
          okAria: "Go to the OKX registration page",
          okLogo: "OKX logo"
        }
      };
      var LANG = "zh-CN";
      try {
        var saved = localStorage.getItem("vip-lang");
        if (saved && I18N[saved]) LANG = saved;
      } catch (e) {}
      function $(id) { return document.getElementById(id); }
      function applyLang(l) {
        if (!I18N[l]) l = "zh-CN";
        LANG = l;
        try { localStorage.setItem("vip-lang", l); } catch (e) {}
        var t = I18N[l];
        document.documentElement.lang = l;
        document.title = t.docTitle;
        $("tTitle").textContent = t.title;
        $("tSubPre").textContent = t.subPre;
        $("tSubPost").textContent = t.subPost;
        $("tNav").setAttribute("aria-label", t.navLabel);
        $("tBnName").textContent = t.bnName;
        $("tBnRank").textContent = t.bnRank;
        $("tBnEnter").textContent = t.bnEnter;
        $("tBnLink").setAttribute("aria-label", t.bnAria);
        $("tBnLogo").setAttribute("aria-label", t.bnLogo);
        $("tOkName").textContent = t.okName;
        $("tOkRank").textContent = t.okRank;
        $("tOkEnter").textContent = t.okEnter;
        $("tOkLink").setAttribute("aria-label", t.okAria);
        $("tOkLogo").setAttribute("aria-label", t.okLogo);
        var btns = document.querySelectorAll("[data-setlang]");
        for (var i = 0; i < btns.length; i++) {
          var on = btns[i].getAttribute("data-setlang") === l;
          btns[i].classList.toggle("on", on);
          btns[i].setAttribute("aria-pressed", on ? "true" : "false");
        }
      }
      var langBtns = document.querySelectorAll("[data-setlang]");
      for (var j = 0; j < langBtns.length; j++) {
        langBtns[j].addEventListener("click", function () {
          applyLang(this.getAttribute("data-setlang"));
        });
      }
      applyLang(LANG);
    </script>
  </body>
</html>
